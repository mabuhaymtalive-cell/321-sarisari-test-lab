
name: 321 TEST LAB Firestore Security Tests

on:
  workflow_dispatch:
  push:
    branches:
      - security-tests-v11-2

jobs:
  firestore-security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          

      - name: Install dependencies
        run: npm install

      - name: Run Firestore Emulator Security Tests
        run: npm run test:emulator
